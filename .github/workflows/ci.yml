name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check (app, tests, edge-function code)
        run: npm run typecheck

      - name: Edge functions: vendored shared code is in sync
        run: npm run check:functions

      - name: Edge functions: type-check with Deno
        run: npm run check:deno

      - name: Unit and component tests
        run: npm test

      - name: Database tests (every migration replayed, RLS and stock rules asserted)
        run: npm run test:db

      - name: Production build
        run: npm run build
